services:
  quizer.api:
    image: ${DOCKER_REGISTRY-}quizerapi
    container_name: quizer.api
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ASPNETCORE_HTTPS_PORTS=5001
      - ConnectionStrings__DefaultConnection=Host=quizer.database;Port=5432;Database=quizer;User Id=postgres;Password=postgres;
    depends_on:
      quizer.database:
        condition: service_healthy
    ports:
      - 5000:5000
      - 5001:5001

  quizer.database:
    image: postgres:18.4-alpine3.23
    container_name: quizer.database
    environment:
      - POSTGRES_DB=quizer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/quizer-db:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  quizer.logs:
    image: datalust/seq
    container_name: quizer.logs
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - ./.containers/quizer-logs:/data
    ports:
      - 8080:80
      - 5341:5341
    restart: unless-stopped
